name: VSTest lab least-privilege issue-label control
on:
  issue_comment:
    types: [created]
permissions:
  issues: read
jobs:
  denied-write:
    if: >-
      github.event.issue.number == 1 &&
      github.event.comment.body == 'LAB_READ_ONLY_LABEL_PROBE_20261116' &&
      github.actor == 'SamCloudJourney'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify read-only CI job cannot add issue labels
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            console.log('LAB_TOKEN_ISSUES_PERMISSION_EXPECTED=read');
            const labels = await github.rest.issues.listLabelsOnIssue({owner:context.repo.owner,repo:context.repo.repo,issue_number:1});
            console.log('LAB_LABEL_READ_ALLOWED=true count='+labels.data.length);
            try {
              await github.rest.issues.addLabels({owner:context.repo.owner,repo:context.repo.repo,issue_number:1,labels:['enhancement']});
              throw new Error('READ_ONLY_LABEL_WRITE_UNEXPECTEDLY_SUCCEEDED');
            } catch(e) {
              if(e.status === 403) {
                console.log('LAB_LABEL_WRITE_REJECTED_STATUS=403');
              } else {
                throw e;
              }
            }
